[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "Jarvis Core prototype: read-only Obsidian-vault context assembly for the AI Operating System."
readme = "docs/software/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Murray" }]
keywords = ["obsidian", "knowledge", "ai-operating-system", "read-only"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

[project.scripts]
jarvis = "jarvis_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_core = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["jarvis_core"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
